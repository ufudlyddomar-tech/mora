<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى شهودتي ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff3366;
            --primary-hover: #e60039;
            --bg-color: #fff0f3;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #2d3748;
            --text-muted: #718096;
            --shadow: 0 20px 40px rgba(255, 51, 102, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #ffe6ed 0%, #fff0f3 50%, #ffd6e0 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* قلوب متحركة في الخلفية */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart-particle {
            position: absolute;
            color: rgba(255, 51, 102, 0.25);
            font-size: 22px;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.4) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            z-index: 10;
        }

        /* شاشة قفل جذابة وفخمة جداً */
        .lock-screen {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 35px;
            padding: 45px 30px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 2px solid rgba(255, 255, 255, 0.9);
            position: relative;
            overflow: hidden;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .lock-badge {
            background: #ffe0e6;
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .lock-title {
            color: var(--text-dark);
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.7;
            font-family: 'Reem Kufi', sans-serif;
        }

        .lock-subtitle {
            color: var(--primary);
            font-size: 17px;
            margin-bottom: 30px;
            font-weight: 700;
            font-family: 'Reem Kufi', sans-serif;
        }

        .heart-icon-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff3366, #ff758c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
            box-shadow: 0 10px 25px rgba(255, 51, 102, 0.4);
            animation: pulseGlow 2s infinite;
        }

        .heart-icon-box i {
            color: white;
            font-size: 35px;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 10px 25px rgba(255, 51, 102, 0.4); }
            50% { transform: scale(1.08); box-shadow: 0 15px 35px rgba(255, 51, 102, 0.6); }
            100% { transform: scale(1); box-shadow: 0 10px 25px rgba(255, 51, 102, 0.4); }
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #ffd1dc;
            border-radius: 50px;
            outline: none;
            font-size: 18px;
            text-align: center;
            color: var(--primary);
            font-weight: 700;
            background: #fff;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.25);
        }

        .btn-unlock {
            background: linear-gradient(135deg, #ff3366, #ff6584);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 51, 102, 0.3);
            transition: all 0.3s ease;
        }

        .btn-unlock:hover {
            background: linear-gradient(135deg, #e60039, #ff3366);
            transform: translateY(-2px);
        }

        .btn-unlock:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 15px;
            font-weight: 700;
            display: none;
        }

        /* المحتوى الرئيسي */
        .main-content {
            display: none;
            flex-direction: column;
            gap: 25px;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        /* كارت الرسالة التفاعلية */
        .message-card {
            border-top: 6px solid var(--primary);
        }

        .message-title {
            color: var(--primary);
            font-size: 21px;
            font-weight: 800;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Reem Kufi', sans-serif;
        }

        .typing-text {
            font-size: 17px;
            line-height: 2;
            color: #2d3748;
            font-weight: 600;
            white-space: pre-line;
            min-height: 150px;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: var(--primary);
            margin-right: 4px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* العداد المطور */
        .counter-card {
            text-align: center;
            background: linear-gradient(135deg, #ffffff, #fff0f3);
        }

        .counter-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            margin-bottom: 20px;
        }

        .counter-badge {
            background: #ffe0e6;
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .counter-title {
            color: var(--primary);
            font-size: 24px;
            font-weight: 800;
            font-family: 'Reem Kufi', sans-serif;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .time-box {
            background: #fff;
            padding: 15px 5px;
            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
            border: 1px solid #ffe6eb;
        }

        .time-value {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary);
            font-family: 'Reem Kufi', sans-serif;
        }

        .time-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 700;
        }

        /* التوقيع مع أيقونات السوشيال ميديا الأصلية */
        .footer-card {
            text-align: center;
            padding: 25px;
        }

        .designed-by {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 18px;
        }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 50px;
            background: #fff0f3;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid #ffccd5;
            transition: all 0.3s ease;
        }

        .social-btn i {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="hearts-bg" id="heartsBg"></div>

    <div class="container">
        <!-- شاشة قفل فخمة وجذابة -->
        <div class="lock-screen" id="lockScreen">
            <span class="lock-badge">مفاجأة خاصة 🎁</span>
            <div class="heart-icon-box">
                <i class="fa-solid fa-heart"></i>
            </div>
            <div class="lock-title">عملت لك حاجة حلوة كدا بسيطة لعيونك الحلوين يا روحي ✨</div>
            <div class="lock-subtitle">اكتبي كلمة السر يا شهواتي ❤️</div>
            
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="" dir="ltr">
            </div>
            <button class="btn-unlock" onclick="checkPassword()">
                فتح الهدية 🔓✨
            </button>
            <div class="error-msg" id="errorMsg">كلمة السر غلط يا روحي، جربي تاريخ ارتباطنا!</div>
        </div>

        <!-- المحتوى الرئيسي -->
        <div class="main-content" id="mainContent">
            <!-- رسالة خاصة لشهودة نور عيني -->
            <div class="card message-card">
                <div class="message-title">
                    <span>رسالة خاصة لشهودة نور عيني</span>
                    <span>💌</span>
                </div>
                <div class="typing-text">
                    <span id="typedContent"></span><span class="cursor"></span>
                </div>
            </div>

            <!-- العداد المطور -->
            <div class="card counter-card">
                <div class="counter-header">
                    <span class="counter-badge">قصة حبنا</span>
                    <div class="counter-title">أحلى أيام عمري معاكي ❤️</div>
                </div>
                
                <div class="timer-grid">
                    <div class="time-box">
                        <div class="time-value" id="days">00</div>
                        <div class="time-label">يوم</div>
                    </div>
                    <div class="time-box">
                        <div class="time-value" id="hours">00</div>
                        <div class="time-label">ساعة</div>
                    </div>
                    <div class="time-box">
                        <div class="time-value" id="minutes">00</div>
                        <div class="time-label">دقيقة</div>
                    </div>
                    <div class="time-box">
                        <div class="time-value" id="seconds">00</div>
                        <div class="time-label">ثانية</div>
                    </div>
                </div>
            </div>

            <!-- التوقيع مع أيقونات إنستجرام وتيك توك الأصلية -->
            <div class="card footer-card">
                <div class="designed-by">صُنِع بكل حب بواسطة عمورة ❤️</div>
                <div class="social-container">
                    <a href="#" class="social-btn">
                        <i class="fa-brands fa-instagram" style="color: #E1306C;"></i>
                        <span>3moar.1</span>
                    </a>
                    <a href="#" class="social-btn">
                        <i class="fa-brands fa-tiktok" style="color: #000000;"></i>
                        <span>3moar.1</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function createHearts() {
            const container = document.getElementById('heartsBg');
            const heartIcons = ['❤️', '💖', '💕', '🌸', '✨', '😻'];
            for (let i = 0; i < 35; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(heart);
            }
        }
        createHearts();

        function checkPassword() {
            const input = document.getElementById('passwordInput').value.trim().replace(/\//g, '');
            const error = document.getElementById('errorMsg');
            
            if (input === '25102025') {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'flex';
                startTyping();
                startTimer();
            } else {
                error.style.display = 'block';
            }
        }

        const fullMessage = `بصي بقى يا بت، إنتي مش مجرد بنت في حياتي، ده إنتي حياتي كلها والله يا شهودتي!

وانا من أول يوم ارتبطت بيكي وانا حاسس إني لقيت الجزء اللي ناقص مني والله، لأن إنتي دخلتي حياتي غيرتي كل حاجة جوايا وخليتيني حد تاني خالص.

وكل لحظة معاكي بالنسبة لي، وانا معاكي بتمنى إنها متعديش والله!

انا عارف إن الدنيا مش علطول سهلة وبيبقى فيها مشاكل، وعارف إني زعلتك مني، بس انا والله العظيم عمري ما اتغير عليكي ولا عمر حبك في قلبي يقل 1% والله، انا مبكونش قصدي أزعلك خالص يا نور عيني، ومفيش حاجة في الدنيا كلها تستاهل إني أخسرك والله يا حتة مني، لأن إنتي أغلى حاجة في حياتي وأجمل من أي كلام ممكن يتقال.

والله يشهد انا بحبك بطريقة يمكن لو قعدت عمر فوق عمري مش هعرف أوصفهالك بجد، بس كل اللي أقدر أقولهولك إنك سبب راحتي وسبب فرحي دايماً، وإنتي عارفة إن وجودك في حياتي هو أجمل حاجة حصلتلي من يوم ما عرفتك وحياتي بقت أحسن بكتير والله.

وكل ما تبعدي شوية عني كده أو مش بنتكلم شوية بحس إني ناقصني روحي وببقى مش طايق نفسي والله، وكل ما بتضحكي بحس إن الدنيا ضحكتلي كمان.

وبحبك في كل حال والله مش زي ما إنتي بتقولي كده؛ في فرحك وزعلك وسكوتك وكلامك والله.

وربنا يخليكي ليا يا روح قلبي إنتي وما يحرمني منك أبداً 🥹🥹🫂🫂🫂🫂💋
بحبكككككككك🥹😊🫂🫂🫂🫂💋💋💋`;

        function startTyping() {
            const target = document.getElementById('typedContent');
            let index = 0;
            target.innerHTML = '';
            
            const timer = setInterval(() => {
                if (index < fullMessage.length) {
                    target.innerHTML += fullMessage.charAt(index);
                    index++;
                } else {
                    clearInterval(timer);
                }
            }, 30);
        }

        function startTimer() {
            const startDate = new Date('2025-10-25T00:00:00');

            function update() {
                const now = new Date();
                const diff = Math.abs(now - startDate);

                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const m = Math.floor((diff / 1000 / 60) % 60);
                const s = Math.floor((diff / 1000) % 60);

                document.getElementById('days').innerText = String(d).padStart(2, '0');
                document.getElementById('hours').innerText = String(h).padStart(2, '0');
                document.getElementById('minutes').innerText = String(m).padStart(2, '0');
                document.getElementById('seconds').innerText = String(s).padStart(2, '0');
            }

            update();
            setInterval(update, 1000);
        }
    </script>
</body>
</html>
